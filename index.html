<!doctype html><html lang="hi" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptVerse India</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script><style>
body{background:#0b0f19;color:#f1f5f9;font-family:'Plus Jakarta Sans',sans-serif}.glass{background:#111827ed;border:1px solid #ffffff14;backdrop-filter:blur(12px)}.field{width:100%;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:11px;color:white;font-size:13px}.btn{padding:10px 13px;border-radius:12px;font-size:12px;font-weight:700}.orange{background:#ea580c;color:white}.gray{background:#1e293b;border:1px solid #334155;color:#e2e8f0}.cat{background:#111827;border:1px solid #334155;color:#94a3b8;padding:8px 12px;border-radius:10px;font-size:11px;white-space:nowrap}.cat.active{background:#ea580c;color:white}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:12px;color:#cbd5e1}.hide{display:none!important}#toast{position:fixed;bottom:20px;left:5%;width:90%;z-index:99;background:#1e293b;border:1px solid #475569;padding:12px;border-radius:12px;text-align:center;font-size:12px}
</style></head><body class="min-h-screen p-3 sm:p-5"><main class="max-w-lg mx-auto space-y-5">
<header class="flex justify-between items-center"><b class="text-xs tracking-wider text-orange-400">● PROMPTVERSE INDIA</b><button id="admin-open" class="text-[11px] bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-full" onclick="openAdmin()">Admin</button></header>
<section class="glass rounded-3xl p-6 text-center"><img id="avatar" class="w-24 h-24 rounded-full object-cover mx-auto mb-4 ring-4 ring-orange-500/30" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300"><h1 id="pname" class="text-2xl font-extrabold">PromptVerse India</h1><p id="bio" class="text-xs text-slate-400 mt-3">AI आर्ट, बेस्ट प्रॉम्प्ट्स और डेली क्रिएटिव गाइड।</p><div id="social" class="flex flex-wrap justify-center gap-3 mt-4"></div></section>
<section id="vidsec" class="hide space-y-2"><h2 class="text-xs font-bold">▶ वीडियो ट्यूटोरियल</h2><div class="glass p-2 rounded-2xl"><div class="aspect-video"><iframe id="video" class="w-full h-full rounded-xl" allowfullscreen></iframe></div></div></section>
<section class="space-y-3"><div class="flex justify-between"><h2 class="text-sm font-bold">✨ AI प्रॉम्प्ट्स & रेफरेंस</h2><span id="count" class="text-xs text-orange-400">0 प्रॉम्प्ट्स</span></div><input id="search" class="field" placeholder="प्रॉम्प्ट खोजें..." oninput="render()"><div class="flex gap-2 overflow-x-auto"><button class="cat active" onclick="category('ALL',this)">सब देखें</button><button class="cat" onclick="category('Midjourney',this)">Midjourney</button><button class="cat" onclick="category('ChatGPT',this)">ChatGPT</button><button class="cat" onclick="category('Flux AI',this)">Flux AI</button><button class="cat" onclick="category('Leonardo AI',this)">Leonardo AI</button><button class="cat" onclick="category('Other',this)">अन्य</button></div><div id="prompts" class="space-y-4"><p class="text-center text-xs text-slate-500">लोड हो रहा है...</p></div></section>
<section id="admin-box" class="glass rounded-3xl p-5 space-y-4 hide"><div class="flex justify-between items-center border-b border-slate-700 pb-3"><div><b class="text-sm">ओनर कंट्रोल पैनल</b><p class="text-[10px] text-slate-400">Firebase Admin Access</p></div><span id="status" class="text-xs text-slate-400">लॉक</span></div>
<div id="login" class="hide"><div class="flex items-center justify-between mb-3"><p class="text-xs text-slate-400">एडमिन लॉगिन</p><button type="button" onclick="closeAdmin()" class="text-slate-400 text-xs px-2 py-1">बंद करें ✕</button></div><form id="loginform" class="space-y-3"><input id="email" type="email" class="field" placeholder="Admin email" required><input id="password" type="password" class="field" placeholder="Admin password" required><button class="btn orange w-full">लॉगिन करें</button></form><p id="loginerr" class="text-xs text-red-400 mt-2"></p></div>
<div id="dash" class="hide space-y-4"><div class="flex gap-1"><button class="btn orange flex-1" onclick="tab('add')">+ नया</button><button class="btn gray flex-1" onclick="tab('manage')">मैनेज</button><button class="btn gray flex-1" onclick="tab('profile')">प्रोफाइल</button></div>
<div id="add" class="space-y-3"><select id="cat" class="field"><option>Midjourney</option><option>ChatGPT</option><option>Flux AI</option><option>Leonardo AI</option><option value="Other">अन्य (General)</option></select><input id="title" class="field" placeholder="प्रॉम्प्ट टाइटल"><input id="imgfile" type="file" accept="image/*" class="field"><img id="imgprev" class="hide w-full max-h-52 object-cover rounded-xl"><textarea id="text" rows="6" class="field" placeholder="पूरा AI प्रॉम्प्ट यहाँ पेस्ट करें"></textarea><button id="publish" onclick="publish()" class="btn orange w-full">सब यूजर्स के लिए पब्लिश करें</button></div>
<div id="manage" class="hide space-y-3"><p class="text-xs text-slate-400">लाइव प्रॉम्प्ट्स: <span id="mcount">0</span></p><div id="mlist" class="space-y-2 max-h-96 overflow-y-auto"></div></div>
<div id="profile" class="hide space-y-3"><input id="pf" type="file" accept="image/*" class="field"><img id="pfprev" class="hide w-20 h-20 rounded-full object-cover mx-auto"><input id="n" class="field" placeholder="ब्रांड नाम"><textarea id="b" class="field" placeholder="बायो"></textarea><input id="v" class="field" placeholder="YouTube वीडियो URL"><input id="ig" class="field" placeholder="Instagram URL"><input id="yt" class="field" placeholder="YouTube चैनल URL"><input id="wa" class="field" placeholder="WhatsApp नंबर, देश कोड सहित"><input id="tg" class="field" placeholder="Telegram URL"><input id="web" class="field" placeholder="वेबसाइट URL"><button onclick="saveProfile()" class="btn w-full bg-emerald-600">सेटिंग्स सेव करें</button></div><button onclick="logout()" class="btn gray w-full">लॉगआउट</button></div></section>
<footer class="text-center text-[10px] text-slate-600 py-4">PromptVerse India © 2026</footer></main><div id="toast" class="hide"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBiqQNAriWNoL9FUzQcUMCP4-Z9ueARY7c",authDomain:"promptverseindia-d437d.firebaseapp.com",projectId:"promptverseindia-d437d",storageBucket:"promptverseindia-d437d.firebasestorage.app",messagingSenderId:"764009719974",appId:"1:764009719974:web:284e789aa962da8f96eca7"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let items=[],filter="ALL",pimg="",pfimg="",unsub=null;
const $=id=>document.getElementById(id),say=m=>{let t=$("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add("hide"),3000)};
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safe(u){try{let x=new URL(u);return ["https:","http:"].includes(x.protocol)?x.href:""}catch{return""}}
function category(c,b){filter=c;document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function render(){let q=$("search").value.toLowerCase(),a=items.filter(x=>(filter==="ALL"||x.category===filter)&&((x.title||"").toLowerCase().includes(q)||(x.text||"").toLowerCase().includes(q)||(x.category||"").toLowerCase().includes(q)));$("count").textContent=items.length+" प्रॉम्प्ट्स";$("mcount").textContent=items.length;$("prompts").innerHTML=a.length?a.map(x=>`<article class="glass rounded-2xl p-4 space-y-3">${x.image?`<img src="${x.image}" loading="lazy" class="w-full max-h-80 object-cover rounded-xl">`:""}<div class="flex justify-between gap-2"><b class="text-sm">${esc(x.title)}</b><span class="text-[10px] text-orange-400">${esc(x.category)}</span></div><div class="prompt">${esc(x.text)}</div><button class="btn orange w-full" onclick="copyText('${x.id}')">प्रॉम्प्ट कॉपी करें</button></article>`).join():'<div class="glass rounded-xl p-6 text-center text-xs text-slate-500">अभी कोई प्रॉम्प्ट नहीं मिला।</div>';$("mlist").innerHTML=items.map(x=>`<div class="bg-slate-900 p-3 rounded-xl"><b class="text-xs">${esc(x.title)}</b><button class="btn bg-red-600/20 text-red-400 w-full mt-2" onclick="del('${x.id}')">डिलीट करें</button></div>`).join()}
async function copyText(id){let x=items.find(y=>y.id===id);if(!x)return;try{await navigator.clipboard.writeText(x.text)}catch{let a=document.createElement("textarea");a.value=x.text;document.body.append(a);a.select();document.execCommand("copy");a.remove()}say("प्रॉम्प्ट कॉपी हो गया!")}
function isAdmin(){return auth.currentUser&&db.collection("admins").doc(auth.currentUser.uid).get().then(d=>d.exists&&d.data().enabled===true)}
$("loginform").onsubmit=async e=>{e.preventDefault();$("loginerr").textContent="";try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(err){$("loginerr").textContent=({ "auth/invalid-credential":"ईमेल या पासवर्ड गलत है।","auth/invalid-email":"ईमेल सही नहीं है।","auth/too-many-requests":"कुछ देर बाद कोशिश करें।","auth/network-request-failed":"इंटरनेट कनेक्शन जाँचें।"})[err.code]||err.message}};
auth.onAuthStateChanged(async u=>{if(unsub){unsub();unsub=null}if(!u){$("login").classList.add("hide");$("dash").classList.add("hide");$("status").textContent="लॉक";return}try{if(!await isAdmin()){await auth.signOut();$("loginerr").textContent="इस अकाउंट को एडमिन अनुमति नहीं है।";return}$("login").classList.add("hide");$("dash").classList.remove("hide");$("status").textContent="अनलॉक";unsub=db.collection("prompts").where("published","==",true).onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));render()},e=>say("Firestore Rules जाँचें: "+e.message));loadProfile()}catch(e){say(e.message);auth.signOut()}});
async function compress(file,max=700){if(!file||!file.type.startsWith("image/"))throw Error("सही फोटो चुनें");return new Promise((res,rej)=>{let r=new FileReader();r.onerror=()=>rej(Error("फोटो पढ़ नहीं सकी"));r.onload=()=>{let i=new Image();i.onerror=()=>rej(Error("फोटो लोड नहीं हुई"));i.onload=()=>{let s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);let d=c.toDataURL("image/jpeg",.62);d.length>650000?rej(Error("फोटो बहुत बड़ी है, छोटी फोटो चुनें")):res(d)};i.src=r.result};r.readAsDataURL(file)})}
$("imgfile").onchange=async()=>{try{pimg=await compress($("imgfile").files[0]);$("imgprev").src=pimg;$("imgprev").classList.remove("hide")}catch(e){say(e.message);pimg=""}};
$("pf").onchange=async()=>{try{pfimg=await compress($("pf").files[0],500);$("pfprev").src=pfimg;$("pfprev").classList.remove("hide")}catch(e){say(e.message);pfimg=""}};
async function publish(){if(!auth.currentUser)return say("पहले लॉगिन करें");let title=$("title").value.trim(),text=$("text").value.trim();if(!title||!text)return say("टाइटल और प्रॉम्प्ट भरें");$("publish").disabled=true;try{if(!await isAdmin())throw Error("एडमिन अनुमति नहीं है");await db.collection("prompts").add({title,text,category:$("cat").value,image:pimg,published:true,timestamp:Date.now(),createdBy:auth.currentUser.uid});$("title").value=$("text").value=$("imgfile").value="";$("imgprev").classList.add("hide");pimg="";say("प्रॉम्प्ट लाइव पब्लिश हो गया!");tab("manage")}catch(e){say("पोस्ट नहीं हुई: "+e.message)}finally{$("publish").disabled=false}}
async function del(id){if(!confirm("यह पोस्ट डिलीट करें?"))return;try{if(!await isAdmin())throw Error("एडमिन अनुमति नहीं है");await db.collection("prompts").doc(id).delete();say("पोस्ट डिलीट हो गई")}catch(e){say(e.message)}}
function tab(t){["add","manage","profile"].forEach(x=>$(x).classList.toggle("hide",x!==t));if(t==="manage")render();if(t==="profile")loadProfile()}
async function loadProfile(){try{let d=await db.collection("settings").doc("profile").get();if(!d.exists)return;let x=d.data();$("n").value=x.name||"";$("b").value=x.bio||"";$("v").value=x.video||"";$("ig").value=x.insta||"";$("yt").value=x.yt||"";$("wa").value=x.wa||"";$("tg").value=x.tele||"";$("web").value=x.web||"";if(x.avatar){$("pfprev").src=x.avatar}showProfile(x)}catch(e){console.error(e)}}
async function saveProfile(){try{if(!await isAdmin())throw Error("एडमिन अनुमति नहीं है");let x={name:$("n").value.trim(),bio:$("b").value.trim(),video:$("v").value.trim(),insta:$("ig").value.trim(),yt:$("yt").value.trim(),wa:$("wa").value.trim(),tele:$("tg").value.trim(),web:$("web").value.trim(),updatedAt:Date.now()};if(pfimg)x.avatar=pfimg;await db.collection("settings").doc("profile").set(x,{merge:true});pfimg="";say("प्रोफाइल सेव हो गई")}catch(e){say("सेव नहीं हुआ: "+e.message)}}
function showProfile(x){$("pname").textContent=x.name||"PromptVerse India";$("bio").textContent=x.bio||"AI आर्ट, बेस्ट प्रॉम्प्ट्स और डेली क्रिएटिव गाइड।";if(x.avatar)$("avatar").src=x.avatar;let u="";try{let z=new URL(x.video);let id=z.hostname.includes("youtu.be")?z.pathname.slice(1):z.searchParams.get("v")||z.pathname.split("/").pop();if(/^[\w-]{11}$/.test(id))u="https://www.youtube.com/embed/"+id}catch{}$("video").src=u;$("vidsec").classList.toggle("hide",!u);let links=[["Instagram",x.insta,"fa-brands fa-instagram"],["YouTube",x.yt,"fa-brands fa-youtube"],["WhatsApp",x.wa?"https://wa.me/"+x.wa.replace(/\D/g,""):"","fa-brands fa-whatsapp"],["Telegram",x.tele,"fa-brands fa-telegram"],["Website",x.web,"fa-solid fa-globe"]];$("social").innerHTML=links.map(([n,u,i])=>{u=safe(u||"");return u?`<a class="bg-slate-800 rounded-xl px-3 py-2 text-xs" target="_blank" rel="noopener" href="${esc(u)}"><i class="${i}"></i> ${n}</a>`:""}).join()}
db.collection("settings").doc("profile").onSnapshot(d=>{if(d.exists)showProfile(d.data())});
function openAdmin(){ $("admin-box").classList.remove("hide"); if(!auth.currentUser){$("login").classList.remove("hide");$("dash").classList.add("hide")} $("admin-box").scrollIntoView({behavior:"smooth",block:"center"}); }
function closeAdmin(){ $("admin-box").classList.add("hide"); }
async function logout(){await auth.signOut();$("dash").classList.add("hide");$("login").classList.remove("hide");say("लॉगआउट हो गया") }
</script></body></html>
